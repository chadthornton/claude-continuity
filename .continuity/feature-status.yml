settings:
  # wrap-up's continuity-save lands .continuity/ on origin/main (never code).
  push_to_default_branch: true
  # The board review's reviewer reads the product's bets and principles from here.
  product_doc: docs/principles.md

features:
  closure-pass:
    status: building
    next: "Trip-planner trial: briefed trip-planner-27 on 2026-10-19; collect its numbers (board bytes, tokens)"
    summary: >
      Keep a board small and true, and let Chad direct it from a page. Since 2026-10-14 the page
      is a planning table: one table grouped by lasting areas (initiatives under them, sizes,
      activity), Live on top, wind-down and chores, and a checkout bar that sends sessions within
      capacity lanes. Spec: docs/principles.md (9, 10), decisions/closure-pass.md and the
      prototype branch prototype/board-review-page.
    next_steps:
      - { step: "Docs: README points at docs/principles.md; design-brief A1/A3 retired; concept map corrected", done: true }
      - { step: "continuity-state summarises a board over 16 KB", done: true }
      - { step: "lib/continuity-audit: JSON facts, the only reader of board storage", done: true }
      - { step: "Optional milestone rows with claims", done: true }
      - { step: "Record the planning-table design: principles 9 and 10, decisions pruned and rewritten, these steps", done: true }
      - { step: "Optional areas on the board: an `areas:` list (name, what, open question) and `area`, `size`, `aspiration` on an initiative; continuity-board.sh reads them, the audit reports them, startup's summary shows them; boards without them unchanged. Failing scenario tests first" , done: true }
      - { step: "Audit facts for the review: activity per initiative since the last review, sessions running now (wt:status where available), last review date. No model call. Scenario tests incl. a machine without wt:status", done: true }
      - { step: "Reviewer brief and output schema as plugin files: routine mode (audit plus changes since last review) and full mode (areas, sizes, aspirations). Hard chore rule. Schema test; one routine run on trip-planner, read-only, measuring tokens; two-reader check on areas", done: true }
      - { step: "The page in the plugin: area table, Live, wind-down, chores, checkout with lanes (live 1, back 3, quiet 3). Per-project publish, URL on the board; overrides and the confirmed round in the page store. Proof: write as a viewer and read back, then Chad clicks Add and Confirm once", done: true }
      - { step: "/continuity-review: build the pack; routine reviewer as one tool-free call (claude -p --tools \"\" --setting-sources \"\" --strict-mcp-config; one retry with the checker's complaints), full reviewer as an agent; seed; on 'go' read the round, write a brief per pick by kind, set owner, continuity-save, agent-spawn within lanes, message running agents, board changes listed and confirmed last. Removes /continuity-prune (every project using the plugin). Skill scenario fixture, RED first", done: true }
      - { step: "One-line offers from /startup (no session waiting, or board past a size) and wrap-up (several initiatives changed). Skill scenario fixture", done: true }
      - { step: "Wrap-up marks a gotcha that got re-learned. Skill scenario fixture", done: true }
      - { step: "Fix the 10 code-review findings on closure-pass-1-step-5 test first (list in handoffs/closure-pass.md), or dismiss each with a reason", done: true }
      - { step: "Merge closure-pass-1-step-5 into main with the review line in the message (b589373: 9+8 fixed, 3 dismissed over two rounds)", done: true }
      - { step: "Release 0.16.0: CHANGELOG, bump .claude-plugin/{plugin,marketplace}.json, update the installed plugin (69db0cd, v0.16.0)", gate: approval, done: true }
      - { step: "0.17.0: page redesign from Chad's first look (two columns, notes to the reviewer, line/points limits, board changes as Next step) (v0.17.0)", done: true }
      - { step: "Trial on trip-planner through its own session: routine review on 0.17.1, one call 48k in + 14k out, 132 s, no retry, longest line 127 chars (review-trial-1, 2026-10-19). A round sent from it is still to come", done: true }
    in_progress: null

  review-followups:
    status: planned
    next: "Non-critical bugs logged during closure-pass; pick up after the trip-planner trial"
    next_steps:
      - { step: "continuity-save: `push_to_default_branch` in flow style (`settings: { push_to_default_branch: true }`, which its own hint suggests) is missed by its grep (`^[[:space:]]*push_to_default_branch:`); match it anywhere on the line, test with a flow-style board", done: false }
      - { step: "continuity-review SKILL.md gives continuity-state and continuity-save paths (v0.17.3)", done: true }
      - { step: "Routine pack was 88% of trip-planner's board: the review's own round commit counted as activity on every row. Audit skips it (v0.17.3): 105 KB -> 74 KB. Left: audit 24 KB + gotchas 11 KB fixed; capping step text would break chores' exact step match", done: true }
      - { step: "continuity-review-pack: take --audit <path> so it doesn't re-run the audit SKILL step 2 already ran (13 s on trip-planner)", done: false }
      - { step: "Page notes clear once a review read them and its round is sent (Chad 2026-10-19); also fixed go deleting unread notes (v0.17.1, eed5e98)", done: true }
      - { step: "Review page: starters (areas not yet started) get no notes box; their key s:<area>:<n> shifts between reviews, so a note would attach to the wrong starter", done: false }
      - { step: "continuity-review-apply: a starter named <row>-2 matches the audit's <row>-N worktree name guess; pick a suffix the guess can't match", done: false }
      - { step: "Merge PR #1 (cc_landed_sources reads the whole default branch, not -n 500: false CONTINUITY NOT LANDED on trip-planner). Branch worktree-cc-landed-window-1; tests green, merged with 0.17.3, mergeable", done: false }
      - { step: "cc_behind (lib/continuity-commits.sh ~line 109) reads Continuity-Sync trailers from `git log HEAD -n 200`: same window bug, stale count only; drop the -n like cc_landed_sources", done: false }
    in_progress: null

  relay-and-spawn:
    status: polishing
    next: "Spawned-tab visibility (field report #4)"
    summary: >
      Mandates, relays, ownership, gated steps, per-feature handoffs (0.7–0.12)
      and agent-spawn's own-tab-per-worktree launch (claude-config).
    next_steps:
      - { step: "agent-spawn (~/claude-config): color spawned tabs (muxy tab set-color) and print which project view they opened in — field report #4", done: false }
      - { step: "Wrap-up summary prints both MANDATE and RELAY lines on 'continue with a new agent'; RELAY should replace MANDATE", done: false }
    in_progress: null

  worktree-hygiene:
    status: polishing
    next: "Watch mac-diskspace's removable-worktree numbers"
    summary: >
      worktree-sweep (wrap-up Step 6c), wt:status/--tsv and wt:rm in
      claude-config. Worktrees cost ~356 MB each (npm node_modules).
    next_steps: []
    in_progress: null

  task-sync:
    status: planned
    next: "Plan it after closure-pass ships; it touches hooks and wrap-up, which that work also edits"
    summary: >
      A TaskCompleted hook ticks off the matching board step when Claude completes a
      built-in task, so wrap-up reconstructs less. Idea from backloghq/backlog (2026-10-16);
      its storage (outside git, 24 MCP tools) was rejected. See decisions/task-sync.md.
    next_steps:
      - { step: "Confirm the TaskCompleted hook payload (task subject, session, cwd) against Claude Code docs; decide how a task matches a board step (exact text, or a step id in the task)", done: false }
      - { step: "Hook writes a pending tick to a file under .continuity/, never edits feature-status.yml directly; wrap-up applies the ticks. Scenario test first", gate: "decision: auto-apply ticks, or show them at wrap-up for a yes?", done: false }
    in_progress: null

  away-back:
    status: polishing
    next: "(owned by the session that built it)"
    summary: >
      /away and /back hand mid-stream work to a cloud session and back (0.11.0).
      Design: docs/superpowers/specs/2026-09-29-away-back-design.md.
    next_steps: []
    in_progress: null

last_session:
  date: 2026-10-19
  feature: review-followups
  summary: "Fixed cc_landed_sources 500-commit window (false CONTINUITY NOT LANDED on trip-planner); PR #1 open, unmerged. Before: released 0.17.2/0.17.3, review-trial-1 numbers in .context/trial-0.17.1.md."
  blind_spots:
    - "trip-planner's review page (https://claude.ai/artifact/G5PFFv4HWhZzkEgRdzZhWY) was republished by hand from this repo's page.html with its <title> set; its review/current is still 0.16-era text (long lines, 'Chad'), which the page splits and folds until the next review."
    - "Chad asked (2026-10-19) that new non-critical bugs found mid-task go on review-followups, not get fixed in place."
gotchas:
  - "Skill edits are scenario-tested: fixtures in tests/skill-scenarios/, baseline run on a snapshot of the old SKILL.md first (RED), then the edited one. Tell test agents to prefix EVERY command with the fixture PATH — they drop it and find the real ~/.local/bin/agent-spawn."
  - "The installed plugin runs from a versioned cache: bump version in .claude-plugin/{plugin,marketplace}.json, then `claude plugin marketplace update claude-continuity-local && claude plugin update claude-continuity@claude-continuity-local`."
