settings:
  # wrap-up's continuity-save lands .continuity/ on origin/main (never code).
  push_to_default_branch: true

features:
  closure-pass:
    status: building
    mandate: 2026-10-11
    owner: board-review
    next: "Board review: step 5, the canonical review page. Steps 1-4 are on branch worktree-board-review, not merged. Owned by agent board-review"
    summary: >
      Keep a board small and true, and let Chad run it from a page. Grew on 2026-10-11 from
      "retire finished work" into the board review: a canonical page per project, seeded by an
      audit script, where he records verdicts (close, merge, park, keep, start an agent).
      Spec: docs/principles.md and decisions/closure-pass.md. Field evidence: trip-planner's
      round 1 (29 rows, 118 KB, 31 verdicts in 5 minutes).
    next_steps:
      - { step: "Docs: point README 'Design principles' at docs/principles.md; mark design-brief anti-goals A1 and A3 retired; correct the concept map (rows serve bets, principles judge decisions, gates replace lanes, claims carry evidence) and republish to its URL", done: true }
      - { step: "Cap continuity-state output: above a size limit print a per-row summary and point to `show <path>` (trip-planner printed 119 KB at /startup). Failing test first", done: true }
      - { step: "continuity-audit script, JSON out, the only reader of board storage: open/done counts per row, building or polishing rows with zero open steps, feature-shaped rows under workflows:, secret-looking strings, non-text files under .continuity/, YAML and decisions sizes, PR references via gh, rows with no `serves`, gated items, each gotcha's age and the list against its ~10-line cap (needs a date per gotcha). Reads the board through lib/continuity-board.sh", done: true }
      - { step: "Optional schema in templates and README: `kind: milestone` with claims (text, status, evidence, waits_on); the audit lists claims and flags a true one with no evidence. Claims only (Chad 2026-10-11): no `serves`, `for` or bets pointer on the board. Boards without them behave as today", done: true }
      - { step: "Canonical review page in the plugin, from trip-planner's board-close-out.html: the four round-1 fixes, a 'Start an agent' verdict, milestones on top, rows grouped 'needs you' / 'moving without you' from gates. Per-project publish with the URL recorded on the board; write path exercised before handover", done: false }
      - { step: "/continuity-review skill, quick and deep: audit -> seed -> publish -> 'apply the review' -> continuity-save -> re-seed. Prints what a handoff holds before deleting it; groups commissioned fixes by the code they touch and states the count before spawning; chat fallback; removes /continuity-prune", done: false }
      - { step: "Offer the review from /startup when no handoff or mandate is waiting or the board passes a threshold, and from wrap-up when several rows changed. One line each", done: false }
      - { step: "Wrap-up marks a gotcha that got re-learned: compare what the session learned the hard way against existing gotchas and record a match on the entry (Chad 2026-10-11: yes; order not set). Skill edit, needs a scenario fixture", done: false }
      - { step: "Trial on trip-planner through its own session: run the review, fill `serves`, recast invite-rehearsal as a milestone; compare YAML lines and bytes to the 2026-09-28 baseline", gate: "decision: does trip-planner's lists row move its questions to an in-repo wayfinder map?", done: false }
      - { step: "Two-reader experiment, before the deep review is built: two fresh Claudes get trip-planner's board and bets document with no link fields and say which row serves which bet and where the product drifted; Chad corrects the mapping. Record where the readers disagree and how many rows he corrects", done: false }
      - { step: "Deep-mode reflection: a reviewing Claude reads the audit's JSON and the bets document (path from a setting), infers which bet each row serves, and writes a drift section onto the page; Chad corrects a wrong one and only a correction is stored as `serves` on that row", gate: "decision: how often it runs", done: false }
      - { step: "Storage: one file per workstream behind the audit script", gate: "decision: after the page is in use, or sooner?", done: false }
    in_progress: "Steps 1-8 per handoffs/closure-pass.md"

  relay-and-spawn:
    status: polishing
    next: "Spawned-tab visibility (field report #4)"
    summary: >
      Mandates, relays, ownership, gated steps, per-feature handoffs (0.7–0.12)
      and agent-spawn's own-tab-per-worktree launch (claude-config).
    next_steps:
      - { step: "agent-spawn (~/claude-config): color spawned tabs (muxy tab set-color) and print which project view they opened in — field report #4", done: false }
      - { step: "Wrap-up summary prints both MANDATE and RELAY lines on 'continue with a new agent'; RELAY should replace MANDATE", done: false }
    in_progress: null

  worktree-hygiene:
    status: polishing
    next: "Watch mac-diskspace's removable-worktree numbers"
    summary: >
      worktree-sweep (wrap-up Step 6c), wt:status/--tsv and wt:rm in
      claude-config. Worktrees cost ~356 MB each (npm node_modules).
    next_steps: []
    in_progress: null

  away-back:
    status: polishing
    next: "(owned by the session that built it)"
    summary: >
      /away and /back hand mid-stream work to a cloud session and back (0.11.0).
      Design: docs/superpowers/specs/2026-09-29-away-back-design.md.
    next_steps: []
    in_progress: null

last_session:
  date: 2026-10-11
  feature: closure-pass
  summary: "Design session, no code: trip-planner's board close-out became the board review; wrote docs/principles.md (thesis, 3 bets, 8 principles, tested on 15 scenarios) and the build order"
  blind_spots:
    - "Several sessions work this repo in parallel (spawn-ux-fixes, away-back, refactor-classify built 0.10–0.13); fetch and read CHANGELOG before building, or you'll duplicate their work."

gotchas:
  - "Skill edits are scenario-tested: fixtures in tests/skill-scenarios/, baseline run on a snapshot of the old SKILL.md first (RED), then the edited one. Tell test agents to prefix EVERY command with the fixture PATH — they drop it and find the real ~/.local/bin/agent-spawn."
  - "The installed plugin runs from a versioned cache: bump version in .claude-plugin/{plugin,marketplace}.json, then `claude plugin marketplace update claude-continuity-local && claude plugin update claude-continuity@claude-continuity-local`."
