settings:
  # wrap-up's continuity-save lands .continuity/ on origin/main (never code).
  push_to_default_branch: true

features:
  closure-pass:
    status: building
    mandate: 2026-10-11
    owner: closure-pass-1
    next: "Board review as a planning table: step 8 of 13, the reviewer brief. Owned by agent closure-pass-1"
    summary: >
      Keep a board small and true, and let Chad direct it from a page. Since 2026-10-14 the page
      is a planning table: one table grouped by lasting areas (initiatives under them, sizes,
      activity), Live on top, wind-down and chores, and a checkout bar that sends sessions within
      capacity lanes. Spec: docs/principles.md (9, 10), decisions/closure-pass.md and the
      prototype branch prototype/board-review-page.
    next_steps:
      - { step: "Docs: README points at docs/principles.md; design-brief A1/A3 retired; concept map corrected", done: true }
      - { step: "continuity-state summarises a board over 16 KB", done: true }
      - { step: "lib/continuity-audit: JSON facts, the only reader of board storage", done: true }
      - { step: "Optional milestone rows with claims", done: true }
      - { step: "Record the planning-table design: principles 9 and 10, decisions pruned and rewritten, these steps", done: true }
      - { step: "Optional areas on the board: an `areas:` list (name, what, open question) and `area`, `size`, `aspiration` on an initiative; continuity-board.sh reads them, the audit reports them, startup's summary shows them; boards without them unchanged. Failing scenario tests first" , done: true }
      - { step: "Audit facts for the review: activity per initiative since the last review, sessions running now (wt:status where available), last review date. No model call. Scenario tests incl. a machine without wt:status", done: true }
      - { step: "Reviewer brief and output schema as plugin files: routine mode (audit plus changes since last review) and full mode (areas, sizes, aspirations). Hard chore rule. Schema test; one routine run on trip-planner, read-only, measuring tokens; two-reader check on areas", done: false }
      - { step: "The page in the plugin: area table, Live, wind-down, chores, checkout with lanes (live 1, back 3, quiet 3). Per-project publish, URL on the board; overrides and the confirmed round in the page store. Proof: write as a viewer and read back, then Chad clicks Add and Confirm once", done: false }
      - { step: "/continuity-review: audit, reviewer, seed; on 'go' read the round, write a brief per pick by kind, set owner, continuity-save, agent-spawn within lanes, message running agents, board changes listed and confirmed last. Removes /continuity-prune (every project using the plugin). Skill scenario fixture, RED first", done: false }
      - { step: "One-line offers from /startup (no session waiting, or board past a size) and wrap-up (several initiatives changed). Skill scenario fixture", done: false }
      - { step: "Wrap-up marks a gotcha that got re-learned. Skill scenario fixture", done: false }
      - { step: "Trial on trip-planner through its own session: a real round with tokens measured; whether it adopts areas on its board is its call", done: false }
    in_progress: "Step 8 (reviewer brief) on branch closure-pass-1-step-5"

  relay-and-spawn:
    status: polishing
    next: "Spawned-tab visibility (field report #4)"
    summary: >
      Mandates, relays, ownership, gated steps, per-feature handoffs (0.7–0.12)
      and agent-spawn's own-tab-per-worktree launch (claude-config).
    next_steps:
      - { step: "agent-spawn (~/claude-config): color spawned tabs (muxy tab set-color) and print which project view they opened in — field report #4", done: false }
      - { step: "Wrap-up summary prints both MANDATE and RELAY lines on 'continue with a new agent'; RELAY should replace MANDATE", done: false }
    in_progress: null

  worktree-hygiene:
    status: polishing
    next: "Watch mac-diskspace's removable-worktree numbers"
    summary: >
      worktree-sweep (wrap-up Step 6c), wt:status/--tsv and wt:rm in
      claude-config. Worktrees cost ~356 MB each (npm node_modules).
    next_steps: []
    in_progress: null

  task-sync:
    status: planned
    next: "Plan it after closure-pass ships; it touches hooks and wrap-up, which that work also edits"
    summary: >
      A TaskCompleted hook ticks off the matching board step when Claude completes a
      built-in task, so wrap-up reconstructs less. Idea from backloghq/backlog (2026-10-16);
      its storage (outside git, 24 MCP tools) was rejected. See decisions/task-sync.md.
    next_steps:
      - { step: "Confirm the TaskCompleted hook payload (task subject, session, cwd) against Claude Code docs; decide how a task matches a board step (exact text, or a step id in the task)", done: false }
      - { step: "Hook writes a pending tick to a file under .continuity/, never edits feature-status.yml directly; wrap-up applies the ticks. Scenario test first", gate: "decision: auto-apply ticks, or show them at wrap-up for a yes?", done: false }
    in_progress: null

  away-back:
    status: polishing
    next: "(owned by the session that built it)"
    summary: >
      /away and /back hand mid-stream work to a cloud session and back (0.11.0).
      Design: docs/superpowers/specs/2026-09-29-away-back-design.md.
    next_steps: []
    in_progress: null

last_session:
  date: 2026-10-11
  feature: closure-pass
  summary: "Board review steps 1-4 built, reviewed and released as 0.15.0: large boards summarised at startup, continuity-audit, milestone claims. Link fields cut to claims and gates after Chad found the design graph-y"
  blind_spots:
    - "Several sessions work this repo in parallel; fetch and read CHANGELOG before building, or you'll duplicate their work."
    - "decisions/closure-pass.md is over its 30-line budget; prune entries the code now covers before adding more."
    - "No real cloud (/away) session has run the large-board summary; it passed on mawk and gawk locally."

gotchas:
  - "Skill edits are scenario-tested: fixtures in tests/skill-scenarios/, baseline run on a snapshot of the old SKILL.md first (RED), then the edited one. Tell test agents to prefix EVERY command with the fixture PATH — they drop it and find the real ~/.local/bin/agent-spawn."
  - "The installed plugin runs from a versioned cache: bump version in .claude-plugin/{plugin,marketplace}.json, then `claude plugin marketplace update claude-continuity-local && claude plugin update claude-continuity@claude-continuity-local`."
